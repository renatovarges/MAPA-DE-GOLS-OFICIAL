name: Atualizar gols via FootStats

# Roda sozinho todo dia às 09:00 UTC (06:00 no horário de Brasília) e também
# pode ser disparado manualmente pela aba "Actions" do GitHub (botão "Run
# workflow") — use o disparo manual pra TESTAR antes de confiar no agendado.
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        working-directory: scripts
        run: npm install

      - name: Instalar navegador (Playwright)
        working-directory: scripts
        run: npx playwright install --with-deps chromium

      - name: Rodar harvester da FootStats
        env:
          FOOTSTATS_EMAIL: ${{ secrets.FOOTSTATS_EMAIL }}
          FOOTSTATS_PASSWORD: ${{ secrets.FOOTSTATS_PASSWORD }}
        run: node scripts/harvest_footstats_goals.mjs

      - name: Publicar mudancas (se houver)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nenhuma rodada nova — nada pra publicar."
          else
            git commit -m "Atualiza gols via FootStats (automatico)"
            git push
          fi
