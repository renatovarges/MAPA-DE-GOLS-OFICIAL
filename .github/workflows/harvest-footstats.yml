name: Atualizar gols via FootStats

# Roda sozinho todo dia às 09:00 UTC (06:00 no horário de Brasília) e também
# pode ser disparado manualmente pela aba "Actions" do GitHub (botão "Run
# workflow") — use o disparo manual pra TESTAR antes de confiar no agendado.
#
# O harvester (scripts/harvest_footstats_goals.mjs) NÃO grava mais arquivo
# local nem comita no Git — ele fala direto com o site ao vivo
# (POST /api/save-round, o mesmo endpoint do editor manual). É o PRÓPRIO
# servidor quem grava no disco e sincroniza com o GitHub depois. Por isso
# esse workflow não precisa (nem deve) fazer commit/push — só rodar o
# script com ENVIO_REAL=1.
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch: {}

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        working-directory: scripts
        run: npm install

      - name: Instalar navegador (Playwright)
        working-directory: scripts
        run: npx playwright install --with-deps chromium

      - name: Rodar harvester da FootStats (grava direto no site ao vivo)
        env:
          FOOTSTATS_EMAIL: ${{ secrets.FOOTSTATS_EMAIL }}
          FOOTSTATS_PASSWORD: ${{ secrets.FOOTSTATS_PASSWORD }}
          ENVIO_REAL: "1"
          # alerta de falha (e-mail via Resend + WhatsApp via CallMeBot) —
          # se algum secret não estiver configurado, aquele canal só é
          # pulado (ver scripts/lib/alerts.mjs), nunca quebra o harvester.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
        run: node scripts/harvest_footstats_goals.mjs

      - name: Rodar harvester de finalizações (base de padrão, não aparece no campinho)
        env:
          FOOTSTATS_EMAIL: ${{ secrets.FOOTSTATS_EMAIL }}
          FOOTSTATS_PASSWORD: ${{ secrets.FOOTSTATS_PASSWORD }}
          ENVIO_REAL: "1"
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
        # reaproveita o token já cacheado pelo login do passo acima (mesmo job)
        run: node scripts/harvest_footstats_shots.mjs

      - name: Recalcular o retrato de cada time (padrões de ataque/defesa)
        env:
          ENVIO_REAL: "1"
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
        # não precisa de login na FootStats — só lê data/finalizacoes/ do
        # próprio site (já atualizado pelo passo anterior) e grava o retrato
        run: node scripts/build_shot_patterns.mjs

      - name: Gerar leitura estratégica da próxima rodada
        env:
          FOOTSTATS_EMAIL: ${{ secrets.FOOTSTATS_EMAIL }}
          FOOTSTATS_PASSWORD: ${{ secrets.FOOTSTATS_PASSWORD }}
          ENVIO_REAL: "1"
        # Só publica quando há 10 jogos futuros e os 20 times são reconhecidos.
        run: node scripts/build_matchup_summary.mjs
